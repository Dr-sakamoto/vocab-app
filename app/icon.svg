<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VocabBlitz">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
  </defs>

  <!-- 背景：角丸スクエア（インディゴ→パープルのブランドグラデーション） -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="216" r="200" fill="url(#glow)"/>

  <!-- 稲妻（Blitz＝速さ・瞬発力） -->
  <path d="M290 96
           L166 288
           L232 288
           L214 416
           L352 208
           L280 208
           Z"
        fill="url(#bolt)" stroke="#4C3AA8" stroke-width="6" stroke-linejoin="round"/>

  <!-- 単語カードの角（Vocab＝語彙学習）を稲妻の根元にひとつだけ添える -->
  <rect x="118" y="330" width="112" height="78" rx="14" fill="#FFFFFF" opacity="0.16"/>
  <path d="M140 358 h68 M140 380 h44" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
</svg>
